  Email of the account administrator
  
  - Must be a valid email format
  - Maximum 255 characters
  - Following this pattern: `/^[\w+'.-]*[\w'+-]@([A-Z0-9]([A-Z0-9-]*[A-Z0-9])?\.)+[A-Z]{2,}$/i`
  - Disposable email domains are not allowed
  """
  email: String

  """
  First name of the account administrator
  
  - Between 1 and 100 characters
  - Letters from any script, with their accents and marks
  - Between words: spaces, hyphens and dashes, apostrophes, dots and the word separators of other scripts (for example `・`, `·`, `׳`); at most two in a row
  - Must contain at least one letter; must not start or end with a hyphen or dash
  - Rejected: digits, emoji, symbols (modifier symbols such as `´` or `¨` are accepted), characters used in code or markup (`< > & " ? ( ) [ ] { } ; : / \ @ = % + ! # * _ ^`) including their full-width forms, other invisible characters, tabs and line breaks
  - Before the check: zero-width spaces, direction marks and byte order marks are removed, as are invisible joiners and variation selectors next to Latin, Greek or Cyrillic letters and joiners that are not between two letters; commas and repeated spaces become one space; surrounding spaces are removed; accented letters are stored in one standard form. The cleaned name is what is stored.
  """
  firstName: String

  """
  Preferred language of the account admin. Will be used to localize the onboarding process and interface
  """
  preferredLanguage: AccountLanguage

  """
  Last name of the account administrator
  
  - Between 1 and 100 characters
  - Letters from any script, with their accents and marks
  - Between words: spaces, hyphens and dashes, apostrophes, dots and the word separators of other scripts (for example `・`, `·`, `׳`); at most two in a row
  - Must contain at least one letter; must not start or end with a hyphen or dash
  - Rejected: digits, emoji, symbols (modifier symbols such as `´` or `¨` are accepted), characters used in code or markup (`< > & " ? ( ) [ ] { } ; : / \ @ = % + ! # * _ ^`) including their full-width forms, other invisible characters, tabs and line breaks
  - Before the check: zero-width spaces, direction marks and byte order marks are removed, as are invisible joiners and variation selectors next to Latin, Greek or Cyrillic letters and joiners that are not between two letters; commas and repeated spaces become one space; surrounding spaces are removed; accented letters are stored in one standard form. The cleaned name is what is stored.
  """
