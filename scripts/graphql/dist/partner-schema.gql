  Creates an onboarding for a new company account holder.
  
  This mutation is restricted to a [Project access token](https://docs.swan.io/developers/using-api/authentication/).
  """
  createCompanyAccountHolderOnboarding(input: CreateCompanyAccountHolderOnboardingInput!): CreateCompanyAccountHolderOnboardingPayload!

