"""Input for creating a draft fraud dispute case"""
input DraftFraudDisputeCaseInput {
  """
  IDs of the transactions reported as fraudulent. They must all belong to the same account, and card transactions to the same cardholder.
  Swan retrieves their details; they must not be repeated in this input.
  Only outgoing card transactions that are `Booked` (or `Deferred` on deferred-debit cards) and outgoing transfers that are `Booked` can be reported.
  Must be non-empty and contain no duplicates, otherwise BAD_USER_INPUT.
  Max: 100 transactions.
  """
  transactionIds: [ID!]!

  """
  Fraud details, common to all reported transactions. Required before submission.
  """
  fraudDetails: FraudDetailsInput

  """
  Card-specific details. Accepted only if the case includes at least one card transaction.
  """
  fraudCardDetails: FraudCardDetailsInput

  """
  Transfer-specific details. Accepted only if at least one transaction is a transfer.
  """
  fraudTransferDetails: FraudTransferDetailsInput

  """
  Account membership of the fraud victim, on the case's account.
  Required before submission on a transfer-only case. Not accepted on a case with card transactions, where the victim is the cardholder.
  With a User access token, must be the caller's own account membership, unless the caller has `canManageAccountMembership`, otherwise `AccountMembershipNotFoundRejection`.
  """
  victimAccountMembershipId: ID

  """
  Your own reference for this report, stored for reconciliation on your side.
  Max length: 255 characters. Accepted characters: printable ASCII.
  Empty string returns BAD_USER_INPUT.
  Valid format (regex): /^[\x20-\x7E]{1,255}$/
  """
  externalReference: String
}

"""Input for submitting a draft dispute case"""
input SubmitDisputeCaseInput {
  """ID of the draft dispute case to submit"""
  disputeCaseId: ID!
}

"""
Input for updating a draft fraud dispute case.
Omitting an input leaves the stored value unchanged. Null clears it, except for `transactionIds` which returns a BAD_USER_INPUT.
"""
input UpdateDraftFraudDisputeCaseInput {
  """ID of the draft dispute case to update"""
  disputeCaseId: ID!

  """
  Replaces the case's transactions. They must all belong to the same account, and card transactions to the same cardholder.
  `fraudCardDetails` or `fraudTransferDetails` sent in the same call must match these transactions, otherwise `DisputeCaseDetailsNotApplicableRejection`.
  Stored `fraudCardDetails` are removed if no card transaction remains, and `fraudTransferDetails` if no transfer remains.
  A stored `victimAccountMembershipId` is removed if the case now includes card transactions or is on another account.
  Must be non-empty and contain no duplicates, otherwise BAD_USER_INPUT.
  Max: 100 transactions.
  """
  transactionIds: [ID!]

  """Replaces the fraud details"""
  fraudDetails: FraudDetailsInput

  """Replaces the card-specific details"""
  fraudCardDetails: FraudCardDetailsInput

  """Replaces the transfer-specific details"""
  fraudTransferDetails: FraudTransferDetailsInput

  """
  Replaces the account membership of the fraud victim, on the case's account.
  Required before submission on a transfer-only case. Not accepted on a case with card transactions, where the victim is the cardholder.
  With a User access token, must be the caller's own account membership, unless the caller has `canManageAccountMembership`, otherwise `AccountMembershipNotFoundRejection`.
  """
  victimAccountMembershipId: ID

  """
  Replaces your own reference for this report.
  Max length: 255 characters. Accepted characters: printable ASCII.
  Omit input to preserve value. Null clears value. Empty string returns BAD_USER_INPUT.
  Valid format (regex): /^[\x20-\x7E]{1,255}$/
  """
  externalReference: String
}

"""
Fraud details: the fraud as the end user experienced it, common to all reported transactions
"""
