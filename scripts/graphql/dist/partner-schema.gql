  """Document has been uploaded and verified by Swan."""
  Validated

  """Document has been refused by Swan, it must be uploaded again."""
  Refused
}

"""Reason code of the document."""
enum DocumentReasonCode {
  """Company name in document doesn't match our records."""
  CompanyNameMismatch

  """Declared amount in document doesn't match the expected amount."""
  DeclaredAmountMismatch

  """One of the provided documents is too old."""
  ExpiredDocument

  """Address in document doesn't match our records."""
  InvalidAddress

  """Default value when none of the other values is appropriate."""
  InvalidDocument

  """Some information is missing."""
  InvalidOrMissingData

  """Missing identity document of accommodation provider."""
  MissingAccommodationProviderId

  """
  Missing identity document and proof of accommodation from accommodation provider.
  """
  MissingAccommodationProviderIdLetter

  """Missing proof of accommodation from accommodation provider."""
  MissingAccommodationProviderLetter

  """
  Document cannot be accepted for the requested document type. Refer to the [list of accepted documents](https://docs.swan.io/partnership/document-center/proof-address/).
  """
  UnacceptableDocument

  """Accommodation provider's identity document must be in full color."""
  ProviderColorIdDocumentRequired

  """
  Document must be signed, either by hand or electronically with certification.
  """
  MissingSignature

  """
  Document is damaged, in poor condition, or has not been uploaded in the correct file type.
  """
  BadDocumentQuality

  """Only part of the document was provided."""
  FullDocumentRequired

  """Missing accommodation provider's proof of address."""
  MissingProviderProofOfAddress

  """Missing accommodation provider's proof of address and ID document."""
  MissingProviderProofOfAddressAndIdDocument

  """Power of attorney must be provided to Swan."""
  PowerOfAttorneyToSwanRequired

  """Missing company domiciliation statement."""
  MissingCompanyDomiciliationStatement

  """The signature is not handwritten or electronically certified."""
  HandwrittenOrCertifiedElectronicSignatureRequired

  """Document refused for compliance reasons."""
  ComplianceReason

  """Bank name in articles of association document is invalid."""
  InvalidDepositBankName

  """
  Missing the register extract of the company providing accommodation and ID document of the legal representative.
  """
  MissingCompanyProviderRegisterExtract
}

"""
Status of a capital deposit case.
@deprecated look for enum `CapitalDepositStatus` instead.
"""
enum CapitalDepositCaseStatus {
  """
  Technical state when the mutation to create a new capital deposit case is called.
  """
  Initiated

  """
  A new capital deposit case is created and Swan is waiting for the required information to be provided and each shareholder to wire their share of share capital.
  """
  WaitingForRequirements

  """
  Swan is waiting for the notary to provide the Share Deposit Certificate.
  """
  WaitingForShareDepositCertificate

  """Swan is waiting for you to provide the Register Extract."""
  WaitingForRegisterExtract

  """
  Swan is waiting for the notary to wire the share capital on the account of the company being registered.
  """
  WaitingForNotaryTransfer

  """
  The notary has signaled a block while preparing the share deposit certificate. The case will not progress until the issue is resolved. Check the status info for the reason.
  """
  NotaryHoldOnShareDepositCertificate

  """The capital deposit case is completed."""
  Completed

  """The capital deposit case is canceled."""
  Canceled
}

"""Status of a capital deposit case."""
enum CapitalDepositStatus {
  """
  The case has been initiated and is waiting for shareholder verification, fund transfers, document uploads, and completion of company onboarding.
  """
  WaitingForInitialRequirements

  """Swan is reviewing the information and documents provided."""
  PendingInternalReview

  """
  After review, Swan has requested additional details or corrections from the customer and is awaiting their response.
  """
  WaitingForAdditionalInformation

  """
  The notary is reviewing the deposited funds and documents, then preparing and uploading the share deposit certificate to Swan.
  """
  WaitingForNotaryShareDepositCertificate

  """The company must upload its register extract for review by the notary."""
  WaitingForRegisterExtract

  """
  The notary is reviewing the register extract. If the document is rejected by either Swan or the notary, the case will return to WaitingForRegisterExtract.
  """
  WaitingForNotaryTransfer

  """
  The notary has signaled a block while preparing the share deposit certificate. The case will not progress until the issue is resolved. Check the status info for the reason.
  """
  NotaryHoldOnShareDepositCertificate

  """
  The notary has approved all documents and transferred the funds to the newly created company. The capital deposit process is complete.
  """
  Completed

  """
  The case has been canceled upon request. A capital deposit can be canceled at any time before completion by contacting Swan Support. When canceled, the associated shareholder is also canceled.
  """
  Canceled
}

