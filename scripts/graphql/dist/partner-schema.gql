"""Credit limit requested by the account’s legal representative."""
type CreditLimitSettingsRequest {
  """The ID of the credit settings request"""
  id: ID!

  """The status of the credit settings request."""
  statusInfo: CreditLimitSettingsRequestStatusInfo!

  """The consent of the credit settings request."""
  consent: Consent!

  """The amount claimed for the credit limits."""
  amount: Amount!

  """The amount claimed for the credit limits."""
  message: String

  """The repayment settings used for the reimbursements."""
  repaymentSettings: RepaymentSettings!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type CreditLimitSettingsRequestConsentPendingStatusInfo implements CreditLimitSettingsRequestStatusInfo {
  status: CreditLimitSettingsRequestStatus!
}

type CreditLimitSettingsRequestPendingReviewStatusInfo implements CreditLimitSettingsRequestStatusInfo {
  status: CreditLimitSettingsRequestStatus!
}

type CreditLimitSettingsRequestCanceledStatusInfo implements CreditLimitSettingsRequestStatusInfo {
  status: CreditLimitSettingsRequestStatus!
  canceledAt: DateTime!
}

type CreditLimitSettingsRequestApprovedStatusInfo implements CreditLimitSettingsRequestStatusInfo {
  status: CreditLimitSettingsRequestStatus!
  approvedAt: DateTime!
}

type CreditLimitSettingsRequestRefusedStatusInfo implements CreditLimitSettingsRequestStatusInfo {
  status: CreditLimitSettingsRequestStatus!
  reasons: [String]!
  refusedAt: DateTime!
}

"""Implements the Relay Edge interface"""
type CreditLimitSettingsRequestEdge implements Edge {
  """Opaque identifier pointing to this node in the pagination mechanism"""
  cursor: String!

  """The Repayment Cycle entry"""
  node: CreditLimitSettingsRequest!
}

type CreditLimitSettingsRequestConnection implements Connection {
  """CardSettingsRequestEdge list"""
  edges: [CreditLimitSettingsRequestEdge!]!

  """Information about the current, the previous and the next page"""
  pageInfo: PageInfo!

  """Total number of element in the list"""
  totalCount: Int!
}

type CreditLimitSettings {
  id: ID!

  """The different requests made for a credit limit."""
  creditLimitSettingsRequests: CreditLimitSettingsRequestConnection!
  statusInfo: CreditLimitSettingsStatusInfo!
  repaymentSettings: RepaymentSettings!
  currentCycle: RepaymentCycle
  cycles: RepaymentCycleConnection

  """The amount currently available for borrowing"""
  createdAt: DateTime!
  updatedAt: DateTime!

  """The total amount owed"""
  owedAmount: Amount!

  """Authorized amount for the credit limit settings"""
