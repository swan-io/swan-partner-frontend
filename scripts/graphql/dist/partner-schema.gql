"""
Returned when the update of an account holder's pricing policy succeed.
"""
type UpdateAccountHolderPricingPolicySuccessPayload {
  """
  The pricing policy the account holder will be switched to. The switch is asynchronous.
  AccountHolder.pricingPolicy will reflect the new policy once completed (typically within a few seconds).
  """
  pricingPolicy: PricingPolicy!
}

"""
Rejection returned when the requested pricing policy is not in the list of policies available for this account holder.
"""
type PricingPolicyNotAvailableForAccountHolderRejection implements Rejection {
  message: String!
}

"""
Rejection returned when a pricing policy switch is already in progress for this account holder.
Retry after the current switch has completed.
"""
type AccountHolderPricingPolicyUpdateInProgressRejection implements Rejection {
  message: String!
}

"""Rejection returned when a pricing policy is not found."""
type PricingPolicyNotFoundRejection implements Rejection {
  message: String!
}

"""
List of available PricingPolicies and the current one for a given account holder.
"""
type AccountHolderAvailablePricingPolicies {
  """
  List of pricing policies available for the account holder to switch to.
  This is a non-paginated list, the number of policies is expected to remain small (typically fewer than 10).
  """
  availablePricingPolicies: [PricingPolicy!]!

  """The current pricing policy assigned to an account holder."""
  currentPricingPolicy: PricingPolicy
}

"""Pricing policy - A group of custom billing rules and fees."""
type PricingPolicy {
  """Unique identifier of the pricing policy."""
