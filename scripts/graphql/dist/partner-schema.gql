  """URL the user is redirected to after consent has been given"""
  consentRedirectUrl: String!

  """
  reference assigned by the initiating party, to unambiguously identify the transaction. This reference is passed on, unchanged, throughout the entire end-to-end chain. Must match the regex ^[A-Za-z0-9-?.+\/:,'() ]{1,35}$ and cannot begin nor end with /. Also, // is not allowed
  """
  reference: String

  """label (max 140 characters)"""
  label: String

  """Transfer mode of the Standing Order"""
