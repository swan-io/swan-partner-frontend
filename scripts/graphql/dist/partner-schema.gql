"""
Complete digital card for use with Apple Pay or Google Pay

Once the pending phase is over, more data will be available in the response
"""
type CompleteDigitalCard implements DigitalCard {
  """The project ID"""
  projectId: ID!

  """Unique identifier of the card this digital card belongs to"""
  cardId: ID!

  """The card contract ID"""
  cardContractId: ID! @deprecated(reason: "Use `cardId` instead.")

  """Unique identifier of a digital card"""
  id: ID!

  """The type of digitalization that created this digital card."""
  type: DigitalizationType!

  """Created date"""
  createdAt: DateTime!

  """Updated date"""
  updatedAt: DateTime!

  """Wallet Provider (Apple Pay, Google Pay...)"""
  walletProvider: WalletProvider!

  """
  Device
  In case of a wallet application, some information about the device will be provided
  """
  device: Device!

  """
  Masked DPAN with the last four digits visible
  
  This value is present in the user wallet application
  """
  cardMaskedNumber: String!

  """
  Digital Card status information
  
  In this type the status will be either ConsentPending or Pending
  """
  statusInfo: CompleteDigitalCardStatusInfo!

  """Reference of the token in another system (ex: Mastercard)"""
  tokenReferenceId: String
}

"""Pending digital card for use with Apple Pay or Google Pay"""
type PendingDigitalCard implements DigitalCard {
  """The project ID"""
  projectId: ID!

  """Unique identifier of the card this digital card belongs to"""
  cardId: ID!

  """The card contract ID"""
  cardContractId: ID! @deprecated(reason: "Use `cardId` instead.")

  """Unique identifier of a digital card"""
  id: ID!

  """The type of digitalization that created this digital card."""
  type: DigitalizationType!

  """Created date"""
  createdAt: DateTime!

  """Updated date"""
  updatedAt: DateTime!

  """Wallet Provider (Apple Pay, Google Pay...)"""
  walletProvider: WalletProvider!

  """
  Digital Card status information
  
  In this type the status will be either ConsentPending or Pending
  """
  statusInfo: PendingDigitalCardStatusInfo!

  """
  Data to provide to the wallet during in-app provisioning
  
  Signature Data is mandatory for Apple Pay
  
  Google Wallet data is for Google Pay with Unified Push Provisioning: call this field from the
  Google Wallet SDK's `PaymentCredentialsGenerator.generate()` callback, with the `serverSessionId`
  it provides, to also get the Google Opaque Payment Card. It becomes mandatory for Google Pay at
  the Unified Push Provisioning cut-over (end of December 2026): without it, a Google Pay digital
  card is then refused with `BAD_USER_INPUT`.
  
  This data is only available for a digital card in:
  - status: Pending
  - type: InApp
  """
  inAppProvisioningData(signatureData: SignatureData, googleWallet: GoogleWalletProvisioningInput): InAppProvisioningData

  """Reference of the token in another system (ex: Mastercard)"""
  tokenReferenceId: String
}

