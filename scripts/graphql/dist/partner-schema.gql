  closingDate: DateTime!

  """language to generate the statement in (default to account's language)"""
  language: AccountLanguage

  """Type of statement to generate"""
  statementType: StatementType @deprecated(reason: "Use format instead")

  """[NEW] Format of statement to generate"""
  format: AccountStatementFormat
}

